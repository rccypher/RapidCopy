services:
  rapidcopy:
    build: .
    image: rapidcopy:latest
    container_name: rapidcopy
    restart: unless-stopped
    # Bound memory so a runaway/stuck transfer or extraction can't starve the host.
    # (Honored by `docker compose` v2; for `docker run` deploys pass --memory.)
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "8800:8800"
    volumes:
      - ./config:/config
      - /mnt/media/TV_Downloads:/downloads/tv_shows
      - /mnt/MediaVaultV3/Movie_Downloads:/downloads/movies
      # Mount ONLY the seedbox key, not the whole ~/.ssh — a container compromise
      # must not expose every private key on the host.
      - /home/jemunos/.ssh/whatbox_key:/home/rapidcopy/.ssh/id_rsa:ro
      - /media/1tb_drive/rapidcopy_staging:/staging/tv_shows
